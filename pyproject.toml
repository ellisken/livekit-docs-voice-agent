[project]
name = "livekit-docs-voice-agent"
version = "0.1.0"
description = "A voice agent that answers LiveKit questions by searching LiveKit's own docs over MCP"
requires-python = ">=3.10, <3.15"
dependencies = [
    "livekit-agents[mcp]~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
# Copied from agent-starter-python: yarl 1.24.1 shipped only a cp310 wheel.
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
